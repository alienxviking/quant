# cargo audit's exceptions. Each one is an advisory read and judged not to reach
# this workspace, with the reason beside it, so the CI `audit` job stays a gate
# that fails on anything new rather than one that is red until it is ignored.
#
# All four are zstd's, fixed in zstd 0.14 / zstd-safe 8 / zstd-sys 2.1, and
# none can be taken by `cargo update`: parquet 59 accepts zstd 0.13 only. They
# go when the parquet bump does (CLAUDE.md, "Still open"), and this file with
# them. An entry here is a debt with a reason, not a setting.
#
# How zstd is reached: quant-storage and fake-venue call `zstd::bulk`, one
# fresh context per call, on blocks they compressed themselves; parquet's codec
# keeps one `bulk` compressor and decompressor per codec and reuses them.

[advisories]
ignore = [
    # Data from an abandoned stream leaks into the next one on a reused
    # context. Our calls never reuse one. Parquet's do, but a `bulk` call
    # completes its frame in one go, so a stream is abandoned only when a call
    # fails -- decompressing a corrupt page -- and that read errors anyway.
    # The tier it could touch is the disposable one, and `normalize --check`
    # compares it event by event against raw.
    "RUSTSEC-2026-0391",
    # `Seekable::decompress`. The seekable API is behind zstd-safe's
    # `seekable` feature, which nothing in the workspace enables.
    "RUSTSEC-2026-0398",
    # Streaming decompression of a legacy (pre-0.8) frame that fails. Nothing
    # here writes legacy frames, and every file zstd decodes was written by
    # this workspace, so reaching it takes a crafted file in our own data
    # directory.
    "RUSTSEC-2026-0403",
    # The WebAssembly allocator shim. Compiled for wasm targets only, and no
    # crate here builds for one.
    "RUSTSEC-2026-0410",
]
