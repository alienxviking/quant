name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are build failures in CI. A codebase that tolerates warnings
  # accumulates them until nobody reads the output, and then a real one
  # slips through.
  RUSTFLAGS: -D warnings

jobs:
  # The full gate. Everything that is platform-independent is checked here
  # exactly once, so the second job below can stay small.
  check:
    runs-on: ubuntu-latest

    # The metadata tests skip themselves when QUANT_DATABASE_URL is unset, which
    # keeps `cargo test` usable without Docker running locally. That is only
    # acceptable because CI always provides a database -- a test that skips
    # everywhere is worse than no test. This job is where that promise is kept.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant_local_dev
          POSTGRES_DB: quant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant -d quant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      QUANT_DATABASE_URL: postgres://quant:quant_local_dev@localhost:5432/quant

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Test (release)
        # Overflow checks are off by default in release. The money types
        # panic explicitly instead of wrapping, but running the suite in
        # release catches anything that depends on debug-only behaviour --
        # which is exactly the class of bug that only appears in production.
        run: cargo test --workspace --all-features --release

  # Apple Silicon, because that is where the M1 acceptance run was actually
  # spent -- so it is a platform this project depends on, not a hypothetical.
  #
  # A separate job rather than a matrix entry on `check`, for two reasons.
  # GitHub's `services:` containers are Linux-only, so a macOS matrix leg could
  # not have the database however it were written. And macOS runners bill at ten
  # times the rate of Linux on a private repository, which makes "run everything
  # twice" a poor trade for coverage that is almost entirely platform-independent.
  #
  # So this job proves only what Linux cannot: that the workspace builds and its
  # tests pass on aarch64-apple-darwin. The parts that would be identical --
  # formatting, lints, the release-profile run -- are left to `check`.
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # No QUANT_DATABASE_URL here on purpose: the quant-meta integration tests
      # skip themselves, and `check` above is where they are guaranteed to run.
      # What this job is really guarding is the C toolchain surface -- `zstd-sys`
      # compiles C, and `ring` assembles per-architecture -- which is exactly the
      # part that a Linux-only CI would let rot.
      - name: Test
        run: cargo test --workspace --all-features
