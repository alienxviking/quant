[package]
name = "quant-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The seam: the loop that turns market events into strategy calls and strategy
# calls into orders. `docs/engine-contract.md` is the argument; this is the code.
#
# Deliberately knows no venue, no file format and no network. It depends on the
# vocabulary (`quant-core`) and on book reconstruction (`quant-book`) and on
# nothing else, which is what lets the identical engine run a backtest, a paper
# session and production. A dependency here on Parquet or on Binance would mean
# the three worlds were not actually the same code.
[dependencies]
quant-core = { workspace = true }
quant-book = { workspace = true }
# The journal, and only the journal. A paper session's own record of its fills
# has to survive a restart, and the metadata tier is deliberately optional -- so
# this is a file, and JSON Lines is what a person can read at 3am.
serde = { workspace = true }
serde_json = "1"

[lints]
workspace = true
