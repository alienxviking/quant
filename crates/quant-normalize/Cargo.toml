[package]
name = "quant-normalize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The normalized tier: raw venue bytes back out as `MarketEvent`s, in order,
# across a whole capture session.
#
# Like `quant-verify` this sits near the *top* of the graph, because turning
# bytes into events needs both the container format and a venue adapter. Unlike
# `quant-verify`, things are meant to depend on it: the Parquet writer at M2.d
# and the `HistoricalSource`/`ReplaySource` of the engine at M3 are all consumers
# of the same ordered event stream. That is why the replay is an iterator over
# events and not a program that checks a book -- the book is one consumer among
# several, and the one that happens to exist first.
#
# It must never depend on `quant-verify`, and `quant-verify` must never depend on
# it. They answer different questions about the same files: "is this capture
# complete" and "what did the market do". Wiring them together would make each
# one's answer contingent on the other's correctness.
[dependencies]
quant-core = { workspace = true }
quant-storage = { workspace = true }
quant-recorder = { workspace = true }
quant-binance = { workspace = true }
quant-book = { workspace = true }

# Money on disk is DECIMAL(18,8), not INT64. Identical bytes -- parquet backs a
# decimal of precision <= 18 with an int64 -- but the decimal carries the scale
# in the schema, so DuckDB, Polars and pandas read exact decimals instead of
# having to know our 1e8 convention out of band. Invariant 1 says money never
# goes through f64; this is what extends that past our own process boundary.
parquet = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-schema = { workspace = true }

[lints]
workspace = true
