[package]
name = "quant-backtest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Wiring: a historical source, a simulated venue, a strategy, and a report.
#
# The top of the graph, like `quant-verify` -- it is the only crate that knows
# both where events come from and what fills them, because that pairing is what
# a backtest *is*. Nothing may depend on it.
[dependencies]
quant-core = { workspace = true }
quant-book = { workspace = true }
quant-engine = { workspace = true }
quant-normalize = { workspace = true }
quant-sim = { workspace = true }
# The `paper` binary needs the venue adapter (its capture loop and live source)
# and a tokio runtime to drive it. `backtest` needs neither, but a second crate
# for one binary would separate two things that share the strategy and the
# equity recorder -- which is the whole of what makes paper and backtest
# comparable.
quant-binance = { workspace = true }
quant-recorder = { workspace = true }
# The strategy's notes are opaque JSON by design -- see `Strategy::take_notes`.
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# A rehearsal of paper's session against local stand-ins, so that no test
# reaches the venue (`tests/paper_rehearsal.rs`): the market stream's from
# quant-binance's `fake-venue`, and the REST side's from quant-live's
# `fixtures`. Tests only; neither feature reaches a binary.
[dev-dependencies]
quant-binance = { workspace = true, features = ["fake-venue"] }
quant-live = { workspace = true, features = ["fixtures"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
