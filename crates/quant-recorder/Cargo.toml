[package]
name = "quant-recorder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Venue-agnostic recorder plumbing: ingress stamping, sequencing, backpressure
# policy, day rolling, and the writer loop. A venue adapter supplies bytes;
# everything about what happens to them afterwards lives here, so a second venue
# inherits the overload, rolling and gap-accounting behaviour rather than
# reimplementing it.
#
# Deliberately no async runtime and no network dependency. The subtle logic in
# this crate -- what happens when the channel is full -- is then testable
# deterministically, with no sockets and no timing.
[dependencies]
quant-core = { workspace = true }
quant-storage = { workspace = true }
# One metrics line is a value both the emitter and `quant-explain` hold, rather
# than a format they each guess at -- see `metrics::MetricsLine`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[lints]
workspace = true
