[package]
name = "quant-recorder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Venue-agnostic recorder plumbing: ingress stamping, sequencing, backpressure
# policy, and the writer loop. A venue adapter supplies bytes; everything about
# what happens to them afterwards lives here, so a second venue inherits the
# overload and gap-accounting behaviour rather than reimplementing it.
#
# Deliberately no async runtime and no network dependency. The subtle logic in
# this crate -- what happens when the channel is full -- is then testable
# deterministically, with no sockets and no timing.
[dependencies]
quant-core = { workspace = true }
quant-storage = { workspace = true }

[lints]
workspace = true
