[package]
name = "quant-live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The live venue: what a run trades through when its orders are real.
#
# A crate of its own (`docs/live-run.md` §5, *LiveVenue, decided before the
# code*, and the owner's decision 5 in §7). In `quant-binance` it would have
# made that crate depend on `quant-engine`, and with it the data tier, which
# depends on `quant-binance` (`quant-verify`, `quant-normalize`), would compile
# against the trading engine: the shape this project chose against once
# already, when `EventSource` went into `quant-core` so that the crates that
# provide events need not depend on the engine.
#
# So this crate depends on the venue's dialect for its inputs (`orders`,
# `user_data`, `account`) and on the engine for its outputs (`Unready`,
# `ExecutionVenue`), as `quant-sim` does. Nothing depends on it but its tests
# and the binary's crate, `quant-backtest`, whose `live` binary runs it.
[dependencies]
quant-core = { workspace = true }
quant-engine = { workspace = true }
quant-binance = { workspace = true }
# The request worker's channels and its timer. The shell owns no runtime and
# spawns nothing: the worker is a future the binary spawns on its own runtime,
# and the engine thread reaches the channels only with `try_send` and
# `try_recv`, which need none. Already in the graph through quant-binance.
tokio = { version = "1", features = ["sync", "time", "macros"] }
# A shutdown deadline passed is logged as an error.
tracing = "0.1"
# `fixtures` only: the venue's frames written as the venue writes them, and
# credentials made in process for a test's own key pair. `ring` and `base64`
# at the versions quant-binance already links, so they add no crate.
serde_json = { version = "1", optional = true }
ring = { version = "0.17", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
# The machine's tests write the venue's frames as the venue writes them, so
# that every stream input goes through the real classifier and translator.
serde_json = "1"
ring = "0.17"
base64 = "0.22"
# The shell's tests drive the worker on a runtime of their own, and feed the
# account side through the real `AccountFeed` from a channel they hold.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
quant-recorder = { workspace = true }

# `fixtures`: those frames, the wiring pieces and a local REST server, for
# `quant-explain`'s tests too, so that both feed the venue the same bytes.
# Never on in a build that ships.
[features]
fixtures = ["dep:serde_json", "dep:ring", "dep:base64"]

[lints]
workspace = true
