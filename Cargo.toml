[workspace]
resolver = "2"
members = [
    "crates/quant-backtest",
    "crates/quant-binance",
    "crates/quant-book",
    "crates/quant-core",
    "crates/quant-explain",
    "crates/quant-engine",
    "crates/quant-meta",
    "crates/quant-normalize",
    "crates/quant-recorder",
    "crates/quant-sim",
    "crates/quant-storage",
    "crates/quant-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The floor our dependencies actually impose, not an aspiration. Cargo's
# MSRV-aware resolver honours this number when choosing versions, so a stale one
# is not free: at 1.75 it silently held us to `parquet` 54 (early 2025) while 59
# was current, for a promise nothing tests -- CI runs `stable` and
# rust-toolchain.toml pins the channel, not a version. Raise it when a dependency
# we want requires it; never lower it below what we can build.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/alienxviking/quant"

# Every crate pins its shared deps here so versions can never drift between
# the engine, the recorder and the backtester. A version skew between two
# crates that both parse exchange payloads is exactly the kind of bug that
# only shows up in production.
[workspace.dependencies]
quant-backtest = { path = "crates/quant-backtest" }
quant-binance = { path = "crates/quant-binance" }
quant-book = { path = "crates/quant-book" }
quant-core = { path = "crates/quant-core" }
quant-engine = { path = "crates/quant-engine" }
quant-explain = { path = "crates/quant-explain" }
quant-meta = { path = "crates/quant-meta" }
quant-normalize = { path = "crates/quant-normalize" }
quant-recorder = { path = "crates/quant-recorder" }
quant-sim = { path = "crates/quant-sim" }
quant-storage = { path = "crates/quant-storage" }
quant-verify = { path = "crates/quant-verify" }
serde = { version = "1", features = ["derive"] }

# The normalized tier. Default features pull brotli, flate2, lz4, snap, base64
# and arrow-ipc; we compress with zstd exactly as the raw tier does, so none of
# that earns its build time. `arrow` is not optional -- the low-level column API
# would mean hand-rolling the nested LIST<STRUCT> encoding that book levels need.
parquet = { version = "59", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "59"
arrow-buffer = "59"
arrow-schema = "59"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Mechanical enforcement of the "no floating point in the engine" invariant.
# Prices, quantities and P&L are fixed-point integers; a stray f64 is a
# position-drift bug waiting to happen, and it will only surface as a
# reconciliation mismatch against the exchange weeks later.
#
# Note: Cargo does not allow a member crate to inherit `[lints] workspace =
# true` AND add its own rules, so the strict default lives here. A future
# analytics/research crate that legitimately needs floats opts out by
# declaring its own `[lints]` table instead of inheriting this one.
float_arithmetic = "deny"

[profile.release]
# The engine is latency-sensitive; we accept slow builds for a fast binary.
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "fat"
codegen-units = 1
